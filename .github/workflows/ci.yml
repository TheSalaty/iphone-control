name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一个 PR 推了新提交，就取消旧提交还没跑完的那次：macOS runner 少，旧运行会占着队列，
# 后面的排到超时被取消。main 上的每次推送都跑完
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR 只改了文档（Markdown、docs/、website/）时不跑 macOS 编译
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!website/**'

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 锁定工具链（与 Docker 构建镜像一致）：新版 clippy 的 lint 不会在代码没变时把 CI 弄挂
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # vendor/ 是上游代码，不格式化；只检查本仓库的包
      - name: fmt
        run: for p in ictl-l10n ictl-device ictl-wda ictl-sign ictl-unlock ictl-daemon ictl-mcp ictl-protocol iphone-control; do cargo fmt -p $p -- --check; done
      # --all-features：默认不编的 debug-cmds（调试子命令）也要能编译
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  # macOS（Apple Silicon）上能编译、测试通过；格式和平台无关，上面已经查过
  macos:
    needs: [changes]
    # changes 在 main 的推送上会跳过，这时照样跑
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-features：默认不编的 debug-cmds（调试子命令）也要能编译
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  # Cargo.toml 声明的最低版本（rust-version）要真能编译
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # 只验证镜像能构建，不推送
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
